<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self' data: blob:">
  <title>PDF Reader</title>
  <link rel="stylesheet" href="../node_modules/pdfjs-dist/web/pdf_viewer.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar">
    <button id="toggle-thumbs" class="bar-button" title="Show/hide thumbnails" aria-label="Thumbnails" disabled>
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
    </button>

    <div id="tabstrip">
      <div id="tabs"></div>
      <div class="menu-anchor" id="overflow-anchor" hidden>
        <button id="overflow-button" class="overflow-button" title="More tabs"></button>
        <div class="menu" id="overflow-menu" role="menu" hidden></div>
      </div>
      <button id="add-tab" class="bar-button" title="Open PDF (Ctrl+O)" aria-label="Open PDF">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <div id="controls" hidden>
      <button id="prev-page" class="bar-button" title="Previous Page (Ctrl+↑)" aria-label="Previous Page">
        <svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>
      </button>
      <input id="page-field" class="field page-field" inputmode="numeric" aria-label="Page">
      <span id="page-count" class="page-count"></span>
      <button id="next-page" class="bar-button" title="Next Page (Ctrl+↓)" aria-label="Next Page">
        <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </button>

      <span class="bar-divider"></span>

      <button id="zoom-out" class="bar-button" title="Zoom Out (Ctrl+−)" aria-label="Zoom Out">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6"/></svg>
      </button>
      <button id="zoom-in" class="bar-button" title="Zoom In (Ctrl++)" aria-label="Zoom In">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6M11 8v6"/></svg>
      </button>

      <span class="bar-divider"></span>

      <button id="fit-width" class="bar-button" title="Fit Width (Ctrl+1)" aria-label="Fit Width">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 12h10M9.5 9.5 7 12l2.5 2.5M14.5 9.5 17 12l-2.5 2.5"/></svg>
      </button>
      <button id="fit-page" class="bar-button" title="Fit Page (Ctrl+2)" aria-label="Fit Page">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 7v10M9.5 9.5 12 7l2.5 2.5M9.5 14.5 12 17l2.5-2.5"/></svg>
      </button>
      <button id="actual-size" class="bar-button" title="Actual Size 100% (Ctrl+0)" aria-label="Actual Size">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M10 9l1.5-1v6"/></svg>
      </button>

      <div class="menu-anchor">
        <button id="layout-button" class="bar-button wide" title="Layout and rotation" aria-label="Layout" aria-haspopup="menu"></button>
        <div class="menu" id="layout-menu" role="menu" hidden>
          <button class="menu-item" data-layout="single" role="menuitemradio"><span class="check"></span><span class="icon" data-icon="single"></span>Single Page</button>
          <button class="menu-item" data-layout="continuous" role="menuitemradio"><span class="check"></span><span class="icon" data-icon="continuous"></span>Continuous</button>
          <button class="menu-item" data-layout="twoUp" role="menuitemradio"><span class="check"></span><span class="icon" data-icon="twoUp"></span>Two Pages</button>
          <button class="menu-item" data-layout="twoUpContinuous" role="menuitemradio"><span class="check"></span><span class="icon" data-icon="twoUpContinuous"></span>Two Pages, Continuous</button>
          <div class="menu-separator"></div>
          <button class="menu-item" data-rotate="-90" role="menuitem"><span class="check"></span>
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></span>
            Rotate Left<span class="shortcut">Ctrl+L</span></button>
          <button class="menu-item" data-rotate="90" role="menuitem"><span class="check"></span>
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></span>
            Rotate Right<span class="shortcut">Ctrl+R</span></button>
        </div>
      </div>

      <button id="document-button" class="bar-button" title="Pages, saving and export" aria-label="Document" aria-haspopup="menu">
        <svg viewBox="0 0 24 24"><path d="M8 3h8l4 4v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M16 3v4h4M4 7v13a2 2 0 0 0 2 2h10"/><path d="M10 13h6M13 10v6"/></svg>
      </button>

      <button id="export-jpg" class="bar-button" title="Export every page as a JPG image (Ctrl+E)" aria-label="Export as JPG">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="15" height="13" rx="2"/><circle cx="8" cy="9.5" r="1.5"/><path d="m3 16 4-4 4 4 3-3 4 4M21 9v11a1 1 0 0 1-1 1H7"/></svg>
      </button>

      <button id="fullscreen"class="bar-button" title="Full Screen (F11)" aria-label="Full Screen">
        <svg class="enter" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        <svg class="exit" viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>
      </button>

      <span class="bar-divider"></span>

      <div class="search">
        <input id="search-field" class="field" type="search" placeholder="Search" aria-label="Search" spellcheck="false">
        <span id="search-count" class="search-count"></span>
      </div>
    </div>

    <button id="updates-button" class="bar-button" title="Updates" aria-label="Updates" aria-haspopup="menu">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5M12 8v7M9 12l3 3 3-3"/></svg>
    </button>
  </header>

  <main id="documents">
    <section id="empty-state">
      <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
      <h1>No PDF Open</h1>
      <p>Drag one or more PDFs here</p>
      <button id="open-button" class="primary-button">Open PDF…</button>
    </section>
    <div id="export-progress" class="export-progress" role="status" hidden>
      <progress id="export-bar"></progress>
      <span id="export-label"></span>
    </div>
    <div id="update-progress" class="export-progress update-progress" role="status" hidden>
      <progress id="update-bar" max="1"></progress>
      <span>Downloading update…</span>
    </div>
  </main>

  <dialog id="prompt-dialog" class="prompt-dialog">
    <form method="dialog">
      <h2></h2>
      <p></p>
      <input id="prompt-field" class="field" autocomplete="off" spellcheck="false">
      <div class="dialog-buttons">
        <button value="cancel" class="secondary-button" formnovalidate>Cancel</button>
        <button value="ok" class="primary-button"></button>
      </div>
    </form>
  </dialog>

  <script type="module" src="renderer.js"></script>
</body>
</html>
