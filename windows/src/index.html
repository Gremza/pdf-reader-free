<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self' data: blob:">
  <title>PDF Reader</title>
  <link rel="stylesheet" href="../node_modules/pdfjs-dist/web/pdf_viewer.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar">
    <button id="toggle-thumbs" class="bar-button" title="Shfaq/fshih miniaturat" aria-label="Miniaturat" disabled>
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
    </button>

    <div id="tabstrip">
      <div id="tabs"></div>
      <div class="menu-anchor" id="overflow-anchor" hidden>
        <button id="overflow-button" class="overflow-button" title="Tabs të tjerë"></button>
        <div class="menu" id="overflow-menu" role="menu" hidden></div>
      </div>
      <button id="add-tab" class="bar-button" title="Hap PDF (Ctrl+O)" aria-label="Hap PDF">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <div id="controls" hidden>
      <button id="prev-page" class="bar-button" title="Faqja e mëparshme (Ctrl+↑)" aria-label="Faqja e mëparshme">
        <svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>
      </button>
      <input id="page-field" class="field page-field" inputmode="numeric" aria-label="Faqja">
      <span id="page-count" class="page-count"></span>
      <button id="next-page" class="bar-button" title="Faqja tjetër (Ctrl+↓)" aria-label="Faqja tjetër">
        <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </button>

      <span class="bar-divider"></span>

      <button id="zoom-out" class="bar-button" title="Zvogëlo (Ctrl+−)" aria-label="Zvogëlo">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6"/></svg>
      </button>
      <button id="zoom-in" class="bar-button" title="Zmadho (Ctrl++)" aria-label="Zmadho">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6M11 8v6"/></svg>
      </button>

      <span class="bar-divider"></span>

      <button id="fit-width" class="bar-button" title="Gjerësia e plotë (Ctrl+1)" aria-label="Gjerësia e plotë">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 12h10M9.5 9.5 7 12l2.5 2.5M14.5 9.5 17 12l-2.5 2.5"/></svg>
      </button>
      <button id="fit-page" class="bar-button" title="Faqja e plotë (Ctrl+2)" aria-label="Faqja e plotë">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 7v10M9.5 9.5 12 7l2.5 2.5M9.5 14.5 12 17l2.5-2.5"/></svg>
      </button>
      <button id="actual-size" class="bar-button" title="Madhësia reale 100% (Ctrl+0)" aria-label="Madhësia reale">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M10 9l1.5-1v6"/></svg>
      </button>

      <div class="menu-anchor">
        <button id="layout-button" class="bar-button wide" title="Mënyra e shfaqjes dhe rrotullimi" aria-label="Pamja" aria-haspopup="menu"></button>
        <div class="menu" id="layout-menu" role="menu" hidden>
          <button class="menu-item" data-layout="single" role="menuitemradio"><span class="check"></span><span class="icon" data-icon="single"></span>Një faqe</button>
          <button class="menu-item" data-layout="continuous" role="menuitemradio"><span class="check"></span><span class="icon" data-icon="continuous"></span>E vazhduar</button>
          <button class="menu-item" data-layout="twoUp" role="menuitemradio"><span class="check"></span><span class="icon" data-icon="twoUp"></span>Dy faqe</button>
          <button class="menu-item" data-layout="twoUpContinuous" role="menuitemradio"><span class="check"></span><span class="icon" data-icon="twoUpContinuous"></span>Dy faqe, e vazhduar</button>
          <div class="menu-separator"></div>
          <button class="menu-item" data-rotate="-90" role="menuitem"><span class="check"></span>
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></span>
            Rrotullo majtas<span class="shortcut">Ctrl+L</span></button>
          <button class="menu-item" data-rotate="90" role="menuitem"><span class="check"></span>
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></span>
            Rrotullo djathtas<span class="shortcut">Ctrl+R</span></button>
        </div>
      </div>

      <button id="fullscreen" class="bar-button" title="Ekran i plotë (F11)" aria-label="Ekran i plotë">
        <svg class="enter" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        <svg class="exit" viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>
      </button>

      <span class="bar-divider"></span>

      <div class="search">
        <input id="search-field" class="field" type="search" placeholder="Kërko" aria-label="Kërko" spellcheck="false">
        <span id="search-count" class="search-count"></span>
      </div>
    </div>
  </header>

  <main id="documents">
    <section id="empty-state">
      <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
      <h1>Asnjë PDF i hapur</h1>
      <p>Tërhiq një ose më shumë PDF këtu</p>
      <button id="open-button" class="primary-button">Hap PDF…</button>
    </section>
  </main>

  <script type="module" src="renderer.js"></script>
</body>
</html>
